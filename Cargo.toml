[package]
name = "onre-titan"
version = "0.1.0"
edition = "2021"
description = "Titan TradingVenue integration for OnRe Protocol"
license = "MIT"
repository = "https://github.com/onre-finance/onre-titan-integration"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []

[dependencies]
async-trait = "0.1.80"
bytemuck = { version = "1.22", features = ["derive", "min_const_generics"] }
solana-account = "2.2.1"
solana-instruction = "2.2.1"
solana-pubkey = "2.2.1"
solana-sdk = "2.2.1"
spl-token-2022 = { version = "9", features = ["no-entrypoint"] }
spl-associated-token-account = "6"
thiserror = "1.0.65"

[dev-dependencies]
tokio = { version = "1.38.0", features = ["full"] }
litesvm = "0.6.1"
