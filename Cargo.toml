[package]
name = "onre-titan"
version = "0.1.0"
edition = "2021"
description = "Titan TradingVenue integration for OnRe Protocol"
license = "MIT"
repository = "https://github.com/onre-finance/onre-titan-integration"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []

[dependencies]
async-trait = "0.1.80"
bytemuck = { version = "1.22", features = ["derive"] }
log = "0.4.28"
solana-account = "2.2.1"
solana-instruction = "2.2.1"
solana-pubkey = "2.2.1"
solana-program = "2.2.1"
solana-sdk = "2.2.1"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9", features = ["no-entrypoint"] }
spl-associated-token-account = "6"
thiserror = "1.0.65"
onre-pricing = { path = "crates/onre-pricing", features = ["bytemuck"] }

[dev-dependencies]
tokio = { version = "1.38.0", features = ["full"] }
litesvm = "0.6.1"
rand = "0.9.2"
env_logger = "0.11.3"
