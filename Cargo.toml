[package]
name = "onre-jupiter"
version = "0.1.0"
edition = "2021"
description = "Jupiter AMM integration for OnRe Protocol"
license = "MIT"
repository = "https://github.com/onre-finance/jup-onyc-integration"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []

[dependencies]
anyhow = "1.0.89"
jupiter-amm-interface = "0.4.5"
rust_decimal = "1.36.0"
solana-sdk = "2.0.10"
spl-token = { version = "6.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "5.0.2", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "4.0.0", features = ["no-entrypoint"] }
thiserror = "1.0.65"
bytemuck = { version = "1.14", features = ["derive"] }

[dev-dependencies]
tokio = "^1"
